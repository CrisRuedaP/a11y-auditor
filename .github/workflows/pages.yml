name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerate bookmarklets from src/ (build.js has no npm deps)
        run: node bookmarklets/build.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload page/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: bookmarklets/page

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
