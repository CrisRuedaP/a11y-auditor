<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture: ID collision with the bookmarklet itself</title>
  </head>
  <body>
    <!--
      Simulates a real site that already ships its own elements with the
      same id/class the bookmarklet's menu uses ("run-all", "analyzer-btn").
      If the bookmarklet looked up those selectors with
      document.getElementById instead of scoping them to its own panel, the
      user's click on the real button would end up with no listener attached.
    -->
    <button id="run-all" class="analyzer-btn" data-analyzer="no-existe">
      Unrelated site button, same id/class
    </button>
    <h1>Test page</h1>
    <img id="img-no-alt" src="x.png" />
  </body>
</html>
