<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Fixture: colisión de IDs con el propio bookmarklet</title>
  </head>
  <body>
    <!--
      Simula un sitio real que ya trae sus propios elementos con el mismo
      id/clase que usa el menú del bookmarklet ("run-all", "analyzer-btn").
      Si el bookmarklet buscara esos selectores con document.getElementById
      en vez de acotarlos a su propio panel, el click del usuario en el
      botón real terminaría sin ningún listener enganchado.
    -->
    <button id="run-all" class="analyzer-btn" data-analyzer="no-existe">
      Botón ajeno del sitio, mismo id/clase
    </button>
    <h1>Página de prueba</h1>
    <img id="img-no-alt" src="x.png" />
  </body>
</html>
